version: '3.8'

services:
  middleware:
    build: .
    container_name: leafnet-omnisend-middleware
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - SYNC_INTERVAL_HOURS=24
      - DB_PATH=/app/data/middleware.db
    env_file:
      - .env
    volumes:
      - middleware-data:/app/data

volumes:
  middleware-data:
